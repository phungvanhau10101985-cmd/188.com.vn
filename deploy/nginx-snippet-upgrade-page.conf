# Trang nâng cấp khi upstream (PM2) tắt — thay 502 mặc định của nginx.
# Include trong server { } có proxy_pass tới Next/API.
error_page 502 503 504 =503 /__188_upgrade.html;
location = /__188_upgrade.html {
    internal;
    alias /var/www/html/188-upgrade.html;
    default_type text/html;
    charset utf-8;
    add_header Retry-After 180 always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
