<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="45">
  <title>Hệ thống đang nâng cấp</title>
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      color: #0f172a;
    }
    main {
      width: 100%;
      max-width: 32rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .pulse {
      width: 12px;
      height: 12px;
      margin: 0 auto 1.1rem;
      border-radius: 999px;
      background: #38bdf8;
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    p {
      margin: 0 0 0.7rem;
      font-size: 1.02rem;
      line-height: 1.6;
      color: #334155;
    }
    .hint {
      margin-top: 1.1rem;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <div class="pulse" aria-hidden="true"></div>
    <h1>Hệ thống đang được nâng cấp</h1>
    <p>Chúng tôi đang cập nhật để phục vụ bạn tốt hơn. Vui lòng quay lại sau ít phút.</p>
    <p class="hint">Trang sẽ tự tải lại. Cảm ơn bạn đã kiên nhẫn.</p>
  </main>
</body>
</html>
