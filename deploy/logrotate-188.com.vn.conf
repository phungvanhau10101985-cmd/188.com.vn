# 188.com.vn — xoay log theo ngày, giữ 7 ngày rồi xóa.
# Cài: bash deploy/install-logrotate.sh
# copytruncate: PM2 + Python FileHandler giữ file đang mở.

/root/.pm2/logs/188-api-out.log
/root/.pm2/logs/188-api-error.log
/root/.pm2/logs/188-web-out.log
/root/.pm2/logs/188-web-error.log
/var/www/188.com.vn/backend/app/logs/app.log
/var/log/188-watchdog.log
/var/log/188-watchdog-web.log
/var/log/188-storefront-monitor.log
/var/log/188-bunny-delete-cron.log
/var/log/188-backup.log
{
	daily
	rotate 7
	missingok
	notifempty
	compress
	delaycompress
	dateext
	dateformat -%Y%m%d
	copytruncate
	su root root
	lastaction
		find /var/log/188-api-incidents -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} + 2>/dev/null || true
	endscript
}
